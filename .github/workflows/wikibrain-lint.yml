name: WikiBrain LINT
on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"
permissions:
  contents: write
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run lint
        run: |
          python - <<'PY'
          import re, pathlib, datetime
          notes = {p.stem: p for p in pathlib.Path(".").rglob("*.md")
                   if not any(x.startswith(".") for x in p.parts) and p.name != "lint-report.md"}
          link = re.compile(r"\[\[([^\]|#]+)(?:[#|][^\]]*)?\]\]")
          inbound = {k: set() for k in notes}
          broken, nofm = [], []
          for n, p in notes.items():
              t = p.read_text(encoding="utf-8", errors="ignore")
              if not t.startswith("---"):
                  nofm.append(n)
              body = re.sub(r"```.*?```|`[^`]*`", "", t, flags=re.S)
              for l in link.findall(body):
                  l = l.strip()
                  if l in notes:
                      if l != n:
                          inbound[l].add(n)
                  else:
                      broken.append((n, l))
          orph = [n for n, s in inbound.items() if not s and n not in ("index", "README", "log")]
          now = datetime.datetime.now(datetime.timezone.utc)
          out = ["# Lint report", "Generated " + now.strftime("%Y-%m-%d %H:%M") + " UTC", "",
                 "Notes scanned: " + str(len(notes)), "", "## Broken links"]
          out += ["- " + a + " -> " + b for a, b in broken] or ["- none"]
          out += ["", "## Orphan notes"] + (["- " + o for o in orph] or ["- none"])
          out += ["", "## Missing frontmatter"] + (["- " + n for n in nofm] or ["- none"])
          pathlib.Path("lint-report.md").write_text("\n".join(out) + "\n")
          print("\n".join(out))
          PY
      - name: Commit report as wikibrain-bot
        run: |
          git config user.name "wikibrain-bot"
          git config user.email "wikibrain-bot@users.noreply.github.com"
          git add lint-report.md
          git diff --cached --quiet || git commit -m "wikibrain-bot: lint report"
          git pull --rebase origin main
         git push
