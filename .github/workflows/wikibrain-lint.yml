name: WikiBrain Lint

on:
  workflow_dispatch:          # the "Run workflow" button
  schedule:
    - cron: "0 13 * * *"      # daily at 13:00 UTC (about 6 am in Boise)

permissions:
  contents: write             # lets the bot commit lint-report.md

concurrency:
  group: wikibrain-lint       # never run two lint jobs at once
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run LINT
        run: python scripts/lint.py

      - name: Commit report if it changed
        run: |
          git config user.name "wikibrain-bot"
          git config user.email "wikibrain-bot@users.noreply.github.com"
          git add lint-report.md
          if git diff --cached --quiet; then
            echo "lint-report.md unchanged; skipping commit."
          else
            git commit -m "lint: update WikiBrain health report"
            git push
          fi
